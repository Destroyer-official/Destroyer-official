<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#238636" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>

  <style>
    .terminal-header {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11.5px;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
    .ascii-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #e6edf3;
      white-space: pre;
      text-anchor: middle;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="836" height="176" rx="8" ry="8" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Terminal Window Controls -->
  <circle cx="22" cy="18" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="4.5" fill="#ffbd2e" />
  <circle cx="50" cy="18" r="4.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="420" y="22" text-anchor="middle" class="terminal-header">root@destroyer:~# init_core --system</text>

  <!-- Divider line -->
  <line x1="2" y1="32" x2="838" y2="32" stroke="#21262d" stroke-width="1" />

  <!-- Centered ASCII Art Lines -->
  <g transform="translate(420, 56)">
    <text x="0" y="0" class="ascii-text">██████╗ ███████╗███████╗████████╗██████╗  ██████╗ ██╗   ██╗███████╗██████╗ </text>
    <text x="0" y="19" class="ascii-text">██╔══██╗██╔════╝██╔════╝╚══██╔══╝██╔══██╗██╔═══██╗╚██╗ ██╔╝██╔════╝██╔══██╗</text>
    <text x="0" y="38" class="ascii-text">██║  ██║█████╗  ███████╗   ██║   ██████╔╝██║   ██║ ╚████╔╝ █████╗  ██████╔╝</text>
    <text x="0" y="57" class="ascii-text">██║  ██║██╔══╝  ╚════██║   ██║   ██╔══██╗██║   ██║  ╚██╔╝  ██╔══╝  ██╔══██╗</text>
    <text x="0" y="76" class="ascii-text">██████╔╝███████╗███████║   ██║   ██║  ██║╚██████╔╝   ██║   ███████╗██║  ██║</text>
    <text x="0" y="95" class="ascii-text">╚═════╝ ╚══════╝╚══════╝   ╚═╝   ╚═╝  ╚═╝ ╚═════╝    ╚═╝   ╚══════╝╚═╝  ╚═╝</text>
  </g>
</svg>